<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test IQ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #cbd5e1;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
      margin-bottom: 28px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .question {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid #334155;
    }
    .question:last-of-type { border-bottom: none; }
    .question h3 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: #f1f5f9;
      line-height: 1.45;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 6px;
    }
    .options label:hover {
      background: #334155;
    }
    input[type="radio"] {
      accent-color: #3b82f6;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #result {
      margin-top: 28px;
      padding: 22px;
      border-radius: 12px;
      display: none;
      line-height: 1.5;
    }
    #result.success {
      background: #064e3b;
      color: #6ee7b7;
      display: block;
    }
    #result.error {
      background: #7f1d1d;
      color: #fca5a5;
      display: block;
    }
    .iq-value {
      font-size: 1.7rem;
      font-weight: 700;
      margin: 10px 0 6px;
      color: #34d399;
    }
    .wrong-list {
      margin-top: 18px;
      text-align: left;
      background: #0f172a;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .wrong-list h4 {
      margin-bottom: 10px;
      color: #fca5a5;
      font-size: 1rem;
    }
    .wrong-item {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      font-size: 0.92rem;
    }
    .wrong-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .wrong-item .q {
      color: #e2e8f0;
      margin-bottom: 4px;
    }
    .wrong-item .correct {
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test IQ</h1>
    <p class="subtitle">10 pytań • losowa kolejność • wynik orientacyjny</p>

    <form id="quizForm">
      <label for="name">Twoje imię</label>
      <input type="text" id="name" name="name" required placeholder="Wpisz imię...">

      <div id="questionsContainer"></div>

      <button type="submit" id="submitBtn">Sprawdź wynik</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    // ========== KONFIGURACJA ==========
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqQXNBRTwN95XiEt5t9he96XV2tlZjkIduuLAPxV0n5SB_5Fye6nkpf8p4bAFLQ_Siaw/exec";
    // ==================================

    const questionsBank = [
      {
        question: "Która liczba powinna być następna w ciągu: 2, 6, 12, 20, 30, ...?",
        options: ["40", "42", "36", "48"],
        correct: 1
      },
      {
        question: "Jeśli wszyscy Florkowie są Gorkami, a niektóre Gorki są Borkami, to które stwierdzenie jest prawdziwe?",
        options: [
          "Wszyscy Florkowie są Borkami",
          "Niektóre Florki mogą być Borkami",
          "Żaden Florek nie jest Borkiem",
          "Wszystkie Borki są Florkami"
        ],
        correct: 1
      },
      {
        question: "Które słowo nie pasuje do pozostałych?",
        options: ["Pociąg", "Samochód", "Rower", "Droga"],
        correct: 3
      },
      {
        question: "Jaka jest następna litera w ciągu: A, C, F, J, O, ...?",
        options: ["T", "U", "S", "V"],
        correct: 1
      },
      {
        question: "Ile wynosi 15% z 80?",
        options: ["10", "12", "15", "8"],
        correct: 1
      },
      {
        question: "Jeśli 5 maszyn robi 5 elementów w 5 minut, to ile czasu zajmie 100 maszynom zrobienie 100 elementów?",
        options: ["100 minut", "5 minut", "20 minut", "1 minuta"],
        correct: 1
      },
      {
        question: "Która figura logicznie uzupełnia ciąg: ○ △ □ ○ △ ...?",
        options: ["○", "△", "□", "◇"],
        correct: 2
      },
      {
        question: "Słowo \"KOT\" ma taką samą relację do \"PIES\", jak \"MEBEL\" do:",
        options: ["Krzesło", "Stół", "Szafa", "Meble"],
        correct: 0
      },
      {
        question: "Która liczba jest nieparzysta?",
        options: ["222", "1116", "334", "1001"],
        correct: 3
      },
      {
        question: "Jeśli dziś jest wtorek, to jaki dzień będzie za 100 dni?",
        options: ["Czwartek", "Piątek", "Sobota", "Niedziela"],
        correct: 0
      }
    ];

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const container = document.getElementById("questionsContainer");
    let currentQuestions = [];

    function renderQuestions() {
      currentQuestions = shuffle(questionsBank).map(q => {
        const indices = shuffle([0, 1, 2, 3]);
        const shuffledOptions = indices.map(i => q.options[i]);
        const newCorrect = indices.indexOf(q.correct);
        return {
          question: q.question,
          options: shuffledOptions,
          correct: newCorrect
        };
      });

      container.innerHTML = "";
      currentQuestions.forEach((q, index) => {
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `
          <h3>${index + 1}. ${q.question}</h3>
          <div class="options">
            ${q.options.map((opt, i) => `
              <label>
                <input type="radio" name="q${index}" value="${i}" required>
                ${opt}
              </label>
            `).join("")}
          </div>
        `;
        container.appendChild(div);
      });
    }

    renderQuestions();

    function estimateIQ(percent) {
      if (percent >= 90) return 130 + Math.round((percent - 90) * 1.5);
      if (percent >= 80) return 120 + Math.round((percent - 80));
      if (percent >= 70) return 112 + Math.round((percent - 70) * 0.8);
      if (percent >= 60) return 105 + Math.round((percent - 60) * 0.7);
      if (percent >= 50) return 98 + Math.round((percent - 50) * 0.7);
      if (percent >= 40) return 90 + Math.round((percent - 40) * 0.8);
      if (percent >= 30) return 82 + Math.round((percent - 30) * 0.8);
      if (percent >= 20) return 75 + Math.round((percent - 20) * 0.7);
      return 70 + Math.round(percent * 0.25);
    }

    const form = document.getElementById("quizForm");
    const resultDiv = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      if (!name) return;

      let correctCount = 0;
      const total = currentQuestions.length;
      const wrongAnswers = [];

      currentQuestions.forEach((q, index) => {
        const selected = form.querySelector(`input[name="q${index}"]:checked`);
        const selectedValue = selected ? parseInt(selected.value) : -1;

        if (selectedValue === q.correct) {
          correctCount++;
        } else {
          wrongAnswers.push({
            number: index + 1,
            question: q.question,
            correctAnswer: q.options[q.correct]
          });
        }
      });

      const percent = Math.round((correctCount / total) * 100);
      const iq = estimateIQ(percent);

      // Blokujemy formularz
      submitBtn.disabled = true;
      submitBtn.textContent = "Wysyłanie...";
      form.querySelectorAll("input").forEach(el => el.disabled = true);

      // Wysyłka do Google Sheets
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            name: name,
            percent: percent,
            correct: correctCount,
            total: total,
            iq: iq
          })
        });
      } catch (err) {
        console.error("Błąd wysyłki:", err);
      }

      // Pokazujemy wynik na stronie
      let wrongHtml = "";
      if (wrongAnswers.length > 0) {
        wrongHtml = `
          <div class="wrong-list">
            <h4>Błędne odpowiedzi (${wrongAnswers.length}):</h4>
            ${wrongAnswers.map(w => `
              <div class="wrong-item">
                <div class="q"><strong>${w.number}.</strong> ${w.question}</div>
                <div class="correct">Poprawna odpowiedź: ${w.correctAnswer}</div>
              </div>
            `).join("")}
          </div>
        `;
      } else {
        wrongHtml = `<div class="wrong-list" style="color:#6ee7b7;">Gratulacje! Wszystkie odpowiedzi poprawne.</div>`;
      }

      resultDiv.className = "success";
      resultDiv.innerHTML = `
        <div>Wynik: <strong>${percent}%</strong> (${correctCount}/${total})</div>
        <div class="iq-value">Szacowane IQ: ~${iq}</div>
        <div style="font-size:0.88rem; opacity:0.85;">
          (Wynik orientacyjny – to nie jest profesjonalny test IQ)
        </div>
        ${wrongHtml}
      `;
      resultDiv.style.display = "block";

      submitBtn.textContent = "Test zakończony";
    });
  </script>
</body>
</html>
